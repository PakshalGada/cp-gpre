<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>CP Guide</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Noto+Serif:wght@600;700&display=swap"
            rel="stylesheet"
        />
        <link
            rel="stylesheet"
            href="{{ url_for('static', filename='resource.css') }}"
        />

        <!-- Syntax Highlighting: highlight.js -->
        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/base16/catppuccin-mocha.min.css"
        />
        <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
        <!-- C++ language support -->
        <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/cpp.min.js"></script>

        <!-- LaTeX: MathJax -->
        <script>
            window.MathJax = {
                tex: {
                    inlineMath: [
                        ["$", "$"],
                        ["\\(", "\\)"],
                    ],
                    displayMath: [
                        ["$$", "$$"],
                        ["\\[", "\\]"],
                    ],
                    packages: { "[+]": ["ams"] },
                },
                options: {
                    skipHtmlTags: [
                        "script",
                        "noscript",
                        "style",
                        "textarea",
                        "pre",
                        "code",
                    ],
                },
                startup: { typeset: false },
            };
        </script>
        <script
            id="MathJax-script"
            async
            src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js"
        ></script>
    </head>
    <body>
        <div class="app-container">
            <aside class="sidebar">
                <div class="sidebar-header">
                    <h1 class="logo">CP Guide v0.1</h1>
                </div>
                <nav class="sidebar-nav" id="sidebar-nav"></nav>
            </aside>

            <main class="main-content">
                <div class="content-wrapper" id="content-wrapper">
                    <div class="welcome" id="welcome-screen">
                        <h1 class="welcome-title">
                            Competitive Programming Guide v0.1
                        </h1>
                        <p class="welcome-text">
                            these resource are generated by local model. feel
                            free to contribute and make it better.
                        </p>
                    </div>

                    <article
                        class="topic-content"
                        id="topic-content"
                        style="display: none"
                    ></article>
                </div>
            </main>
        </div>

        <script src="{{ url_for('static', filename='resource.js') }}"></script>
    </body>
</html>
