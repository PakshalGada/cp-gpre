<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>CP-GPRE — Resources</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Noto+Serif:wght@600;700&display=swap"
            rel="stylesheet"
        />
        <link
            rel="stylesheet"
            href="{{ url_for('static', filename='resource.css') }}"
        />

        <!-- Syntax highlighting -->
        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/base16/catppuccin-mocha.min.css"
        />
        <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/cpp.min.js"></script>

        <!-- MathJax -->
        <script>
            window.MathJax = {
                tex: {
                    inlineMath: [
                        ["$", "$"],
                        ["\\(", "\\)"],
                    ],
                    displayMath: [
                        ["$$", "$$"],
                        ["\\[", "\\]"],
                    ],
                    packages: { "[+]": ["ams"] },
                },
                options: {
                    skipHtmlTags: [
                        "script",
                        "noscript",
                        "style",
                        "textarea",
                        "pre",
                        "code",
                    ],
                },
                startup: { typeset: false },
            };
        </script>
        <script
            id="MathJax-script"
            async
            src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js"
        ></script>
        <link
            rel="icon"
            type="image/png"
            href="{{ url_for('static', filename='assets/favicon.png') }}"
        />
    </head>
    <body>
        <div class="app-container">
            <nav class="navbar" id="navbar">
                <div class="navbar-inner">
                    <div class="nav-left">
                        <button
                            class="hamburger-btn"
                            id="hamburger-btn"
                            aria-label="Open sidebar"
                        >
                            <svg
                                width="16"
                                height="16"
                                viewBox="0 0 16 16"
                                fill="none"
                                stroke="currentColor"
                                stroke-width="2"
                                stroke-linecap="round"
                            >
                                <line x1="2" y1="4" x2="14" y2="4" />
                                <line x1="2" y1="8" x2="14" y2="8" />
                                <line x1="2" y1="12" x2="14" y2="12" />
                            </svg>
                        </button>
                        <a href="/" class="nav-logo">
                            CP GPRE <span class="nav-version">v1</span>
                        </a>
                        <div class="nav-user-status" id="nav-user-status"></div>
                    </div>

                    <!-- Desktop nav links -->
                    <div class="nav-links">
                        <a href="/" class="nav-link" data-page="home">Home</a>
                        <a
                            href="/resource"
                            class="nav-link active"
                            data-page="resource"
                            >Resources</a
                        >
                        <a
                            href="/practice"
                            class="nav-link"
                            data-page="practice"
                            >Practice</a
                        >
                    </div>

                    <div class="nav-right">
                        <button
                            class="theme-toggle"
                            id="theme-toggle"
                            aria-label="Toggle theme"
                        >
                            <svg class="icon icon-sun" viewBox="0 0 24 24">
                                <circle cx="12" cy="12" r="5" />
                                <line x1="12" y1="1" x2="12" y2="3" />
                                <line x1="12" y1="21" x2="12" y2="23" />
                                <line x1="4.22" y1="4.22" x2="5.64" y2="5.64" />
                                <line
                                    x1="18.36"
                                    y1="18.36"
                                    x2="19.78"
                                    y2="19.78"
                                />
                                <line x1="1" y1="12" x2="3" y2="12" />
                                <line x1="21" y1="12" x2="23" y2="12" />
                                <line
                                    x1="4.22"
                                    y1="19.78"
                                    x2="5.64"
                                    y2="18.36"
                                />
                                <line
                                    x1="18.36"
                                    y1="5.64"
                                    x2="19.78"
                                    y2="4.22"
                                />
                            </svg>
                            <svg class="icon icon-moon" viewBox="0 0 24 24">
                                <path
                                    d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"
                                />
                            </svg>
                        </button>
                    </div>
                </div>
            </nav>

            <!-- ── Sidebar overlay (mobile) ── -->
            <div class="sidebar-overlay" id="sidebar-overlay"></div>

            <!-- ── Sidebar (desktop fixed; mobile drawer) ── -->
            <aside class="sidebar" id="sidebar">
                <div class="sidebar-search">
                    <div class="search-input-wrapper">
                        <svg
                            class="search-icon"
                            viewBox="0 0 16 16"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="2"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                        >
                            <circle cx="6.5" cy="6.5" r="4.5" />
                            <line x1="10.5" y1="10.5" x2="14" y2="14" />
                        </svg>
                        <input
                            type="text"
                            id="sidebar-search"
                            class="sidebar-search-input"
                            placeholder="Search topics, tags, content…"
                            autocomplete="off"
                            spellcheck="false"
                        />
                        <button
                            class="search-clear-btn"
                            id="search-clear-btn"
                            aria-label="Clear search"
                        >
                            <svg
                                width="8"
                                height="8"
                                viewBox="0 0 8 8"
                                fill="none"
                                stroke="currentColor"
                                stroke-width="2"
                                stroke-linecap="round"
                            >
                                <line x1="1" y1="1" x2="7" y2="7" />
                                <line x1="7" y1="1" x2="1" y2="7" />
                            </svg>
                        </button>
                    </div>
                    <!-- Index status indicator -->
                    <div class="search-status" id="search-status" data-state="">
                        <span class="search-status-dot"></span>
                        <span class="search-status-text"></span>
                    </div>
                </div>
                <div class="search-no-results" id="search-no-results">
                    No topics found
                </div>
                <nav class="sidebar-nav" id="sidebar-nav"></nav>
            </aside>

            <!-- ── Main content ── -->
            <main class="main-content">
                <div class="content-wrapper" id="content-wrapper">
                    <div class="welcome" id="welcome-screen">
                        <h1 class="welcome-title">
                            Competitive Programming Guide
                        </h1>
                        <p class="welcome-text">
                            Resources generated by a local model . feel free to
                            contribute and make it better.
                        </p>
                    </div>

                    <article
                        class="topic-content"
                        id="topic-content"
                        style="display: none"
                    ></article>
                </div>
            </main>
        </div>

        <script src="{{ url_for('static', filename='practice_common.js') }}"></script>
        <script src="{{ url_for('static', filename='resource.js') }}"></script>
    </body>
</html>
