<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>CP-GPRE</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Noto+Serif:ital,wght@0,600;0,700;1,600;1,700&display=swap"
            rel="stylesheet"
        />
        <link
            rel="stylesheet"
            href="{{ url_for('static', filename='index.css') }}"
        />
    </head>
    <body>
        <nav class="navbar" id="navbar">
            <div class="navbar-inner">
                <a href="/" class="nav-logo"
                    >CP GPRE <span class="nav-version">v0.1</span></a
                >
                <div class="nav-links">
                    <a href="/" class="nav-link active" data-page="home"
                        >Home</a
                    >
                    <a href="/resource" class="nav-link" data-page="resource"
                        >Resources</a
                    >
                </div>
            </div>
        </nav>

        <!-- Hero -->
        <main class="main">
            <section class="hero">
                <h1 class="hero-title">
                    Master the art of<br />
                    <em>problem solving</em>
                </h1>

                <div class="hero-actions">
                    <a href="/resource" class="btn btn-primary">
                        <span>Browse Resources</span>
                        <svg
                            width="16"
                            height="16"
                            viewBox="0 0 16 16"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="2"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                        >
                            <line x1="3" y1="8" x2="13" y2="8" />
                            <polyline points="9 4 13 8 9 12" />
                        </svg>
                    </a>
                </div>
            </section>

            <footer class="footer">
                <p>
                    <a
                        href="https://github.com/PakshalGada/cp-gpre"
                        target="_blank"
                        >Contribute on GitHub</a
                    >
                </p>
            </footer>
        </main>

        <script src="{{ url_for('static', filename='index.js') }}"></script>
    </body>
</html>
