<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>CP-GPRE</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            rel="stylesheet"
            href="{{ url_for('static', filename='index.css') }}"
        />
        <link
            rel="icon"
            type="image/png"
            href="{{ url_for('static', filename='assets/favicon.png') }}"
        />
    </head>
    <body>
        <!-- ── Navbar ── -->
        <nav class="navbar" id="navbar">
            <div class="navbar-inner">
                <div class="nav-left">
                    <!-- Mobile: hamburger -->
                    <button
                        class="hamburger-btn"
                        id="hamburger-btn"
                        aria-label="Open menu"
                    >
                        <svg
                            width="16"
                            height="16"
                            viewBox="0 0 16 16"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="2"
                            stroke-linecap="round"
                        >
                            <line x1="2" y1="4" x2="14" y2="4" />
                            <line x1="2" y1="8" x2="14" y2="8" />
                            <line x1="2" y1="12" x2="14" y2="12" />
                        </svg>
                    </button>
                    <a href="/" class="nav-logo">
                        CP GPRE <span class="nav-version">v1</span>
                    </a>
                    <div class="nav-user-status" id="nav-user-status"></div>
                </div>

                <!-- Desktop nav links -->
                <div class="nav-links">
                    <a href="/" class="nav-link active" data-page="home"
                        >Home</a
                    >
                    <a href="/resource" class="nav-link" data-page="resource"
                        >Resources</a
                    >
                    <a href="/practice" class="nav-link" data-page="practice"
                        >Practice</a
                    >
                </div>

                <div class="nav-right">
                    <button
                        class="theme-toggle"
                        id="theme-toggle"
                        aria-label="Toggle theme"
                    >
                        <svg class="icon icon-sun" viewBox="0 0 24 24">
                            <circle cx="12" cy="12" r="5" />
                            <line x1="12" y1="1" x2="12" y2="3" />
                            <line x1="12" y1="21" x2="12" y2="23" />
                            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64" />
                            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78" />
                            <line x1="1" y1="12" x2="3" y2="12" />
                            <line x1="21" y1="12" x2="23" y2="12" />
                            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36" />
                            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22" />
                        </svg>
                        <svg class="icon icon-moon" viewBox="0 0 24 24">
                            <path
                                d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"
                            />
                        </svg>
                    </button>
                </div>
            </div>
        </nav>

        <!-- ── Mobile Drawer ── -->
        <div class="sidebar-overlay" id="sidebar-overlay"></div>
        <div class="mobile-drawer" id="mobile-drawer">
            <div class="mobile-drawer-header">
                <a href="/" class="nav-logo">
                    CP GPRE <span class="nav-version">v0.1</span>
                </a>
                <button
                    class="hamburger-btn"
                    id="drawer-close-btn"
                    aria-label="Close menu"
                >
                    <svg
                        width="16"
                        height="16"
                        viewBox="0 0 16 16"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                        stroke-linecap="round"
                    >
                        <line x1="3" y1="3" x2="13" y2="13" />
                        <line x1="13" y1="3" x2="3" y2="13" />
                    </svg>
                </button>
            </div>
            <nav class="mobile-nav">
                <a href="/" class="mobile-nav-link active">Home</a>
                <a href="/resource" class="mobile-nav-link">Resources</a>
                <a href="/practice" class="mobile-nav-link">Practice</a>
            </nav>
        </div>

        <!-- ── Hero ── -->
        <main class="main">
            <section class="hero">
                <h1 class="hero-title">
                    Master the art of<br />
                    <em>problem solving</em>
                </h1>
                <div class="hero-actions">
                    <a href="/resource" class="btn btn-primary">
                        <span>Browse Resources</span>
                        <svg
                            width="16"
                            height="16"
                            viewBox="0 0 16 16"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="2"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                        >
                            <line x1="3" y1="8" x2="13" y2="8" />
                            <polyline points="9 4 13 8 9 12" />
                        </svg>
                    </a>
                    <a href="/practice" class="btn btn-secondary">
                        <span>Practice</span>
                        <svg
                            width="16"
                            height="16"
                            viewBox="0 0 16 16"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="2"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                        >
                            <line x1="3" y1="8" x2="13" y2="8" />
                            <polyline points="9 4 13 8 9 12" />
                        </svg>
                    </a>
                </div>
            </section>

            <footer class="footer">
                <p>
                    <a
                        href="https://github.com/PakshalGada/cp-gpre"
                        target="_blank"
                    >
                        Contribute on GitHub
                    </a>
                </p>
            </footer>
        </main>

        <script src="{{ url_for('static', filename='index.js') }}"></script>
        <script src="{{ url_for('static', filename='practice_common.js') }}"></script>
    </body>
</html>
